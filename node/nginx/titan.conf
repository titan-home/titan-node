# The node's single entry (decisions #17, #59): TLS, `/` for the web UI and
# `/api/` for the API, nothing else. It is mounted over the stock image's
# conf.d/default.conf (decision #19), so it sits inside the http block of the
# stock nginx.conf. nginx runs as its own non-root user and listens on 8443;
# the compose file publishes it as 443.

server_tokens off;

# An update recreates the api container with a new address, and nginx must
# also start while the api is down; so the name is resolved at run time
# through Docker's DNS, again every 10 seconds, instead of once at start.
upstream api {
    zone api 64k;
    server api:8000 resolve;
    resolver 127.0.0.11 valid=10s ipv6=off;
}

# One JSON object per line with the request id (development rules, section
# 16). The path without the query string, and no client address, user agent
# or referer: query strings carry search text, the rest is personal data
# (section 11).
log_format titan escape=json '{"time":"$time_iso8601","request_id":"$request_id","method":"$request_method","path":"$uri","status":$status,"bytes":$body_bytes_sent,"duration":$request_time}';

# Sign-in requests (POST) per client address: 1 a second, up to 11 at
# once. The api counts failed sign-ins in its memory (decision #151); a
# flood would queue password checks until the api ran out of memory and
# restarted, which resets every count. Stopping it here keeps the count.
# Other methods get an empty key, which nginx does not limit.
map $request_method $sign_in_key {
    POST $binary_remote_addr;
    default "";
}
limit_req_zone $sign_in_key zone=sign_in:1m rate=1r/s;

server {
    listen 8443 ssl;
    http2 on;

    access_log /dev/stdout titan;
    # NOTE: only critical errors are logged, because nginx's error lines hold
    # the request line with its query string; upstream errors are not logged
    # here. The api's own logs and the controller's health checks cover them.
    error_log /dev/stderr crit;

    ssl_certificate /etc/nginx/tls/cert.pem;
    ssl_certificate_key /etc/nginx/tls/key.pem;

    # Mozilla's "intermediate" configuration, guideline version 6.0
    # (https://ssl-config.mozilla.org/guidelines/6.0.json, decision #150).
    # No DH parameters: version 6.0 has no DHE ciphers. No OCSP stapling: the
    # certificates a node uses carry no OCSP responder, so nginx would only
    # warn and skip it.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ecdh_curve X25519MLKEM768:X25519:prime256v1:secp384r1;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:MozSSL:10m;
    ssl_session_tickets off;

    # Security headers on every response, errors included. They live here
    # only: a location with an add_header of its own would drop all of them.
    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; require-trusted-types-for 'script'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

    location /api/ {
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Set, not appended: nginx is the first proxy, so a client cannot
        # slip in an address of its choice.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-Id $request_id;
        # Server-sent events: pass every event on at once, and let a stream
        # stay quiet for up to an hour.
        proxy_buffering off;
        proxy_read_timeout 1h;

        # Signing in: the proxy settings above apply here too; proxy_pass is
        # the one directive a nested location does not inherit. No
        # add_header here, so the security headers stay on its answers.
        location = /api/v1/devices {
            limit_req zone=sign_in burst=10 nodelay;
            limit_req_status 429;
            error_page 429 = @sign_in_limited;
            proxy_pass http://api;
        }
    }

    # nginx's own 429 for sign-in, as problem+json like every error of the
    # API: clients generated from the contract cannot read nginx's HTML. No
    # add_header here, so the security headers stay on it.
    location @sign_in_limited {
        default_type application/problem+json;
        return 429 '{"type":"about:blank","title":"Too Many Requests","status":429}';
    }

    # NOTE: answers 404 because there is no web UI yet; it serves the UI
    # files when the web UI arrives in build-plan stage 5.
    location / {
        return 404;
    }
}
