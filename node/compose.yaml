# The node's stack (decisions #1, #17, #19), installed into /opt/titan
# (decision #148). Beside this file in the node folder: `.env` names the
# images and the node folder, `nginx/` holds the nginx config, `tls/` the
# certificate and `secrets/` the secrets. Only nginx is reachable from
# outside, on 443.

name: titan

services:
  nginx:
    image: nginx:1.31.0-alpine@sha256:2f07d83bf561b506400dc183b1b2003803e39efbd22451f848adaba14d28c7c7
    user: "101:101"
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    # Owned by nginx's user: a tmpfs is root's unless told otherwise.
    tmpfs: ["/run:uid=101,gid=101", "/var/cache/nginx:uid=101,gid=101"]
    mem_limit: 64m
    ports: ["443:8443"]
    # A fixed address: the api believes X-Forwarded-For from it only.
    networks:
      titan:
        ipv4_address: 172.31.250.2
    volumes:
      - ./nginx/titan.conf:/etc/nginx/conf.d/default.conf:ro
      - ./tls/cert.pem:/etc/nginx/tls/cert.pem:ro
      - ./tls/key.pem:/etc/nginx/tls/key.pem:ro
    # Proves that nginx answers over TLS, so `up --wait` means it runs. `-k`
    # because the certificate names the node, not 127.0.0.1; no `-f` because
    # `/` answers 404 until the web UI arrives, and any answer will do.
    healthcheck:
      test: ["CMD", "curl", "-sk", "-o", "/dev/null", "https://127.0.0.1:8443/"]
      interval: 10s
      timeout: 3s
      retries: 3
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  api:
    # The images come from `.env`: the controller writes them from the
    # release manifest, pinned by digest; the node test writes local tags.
    image: ${TITAN_API_IMAGE:?}
    # Group 10001 is the group of the controller's socket, so the api can
    # call the controller.
    user: "10001:10001"
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    # Each chat turn gives Claude Code a temporary HOME under /tmp; on tmpfs
    # its transcript never reaches a disk (development rules, section 14).
    tmpfs: [/tmp]
    mem_limit: 512m
    environment:
      TITAN_DATABASE_URL: postgresql+psycopg://titan@db/titan
      TITAN_DATABASE_PASSWORD_FILE: /run/secrets/db_password
      TITAN_TOKEN_KEY_FILE: /run/secrets/token_key
      # nginx alone, not the whole network: no other container can name a
      # client address, which the password-guessing limit counts by.
      TITAN_TRUSTED_PROXIES: 172.31.250.2
      TITAN_CONTROLLER_SOCKET: /run/titan-controller/controller.sock
    secrets: [db_password, token_key]
    volumes: [controller-socket:/run/titan-controller:ro]
    networks: [titan]
    depends_on:
      migrate:
        condition: service_completed_successfully
      # Started first, the controller's image gives the socket's volume its
      # owner and mode.
      controller:
        condition: service_started
    restart: unless-stopped

  # Applies pending migrations, then exits; the api starts only after it.
  migrate:
    image: ${TITAN_ADMIN_IMAGE:?}
    command: ["titan-admin", "migrate"]
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    mem_limit: 256m
    environment:
      TITAN_DATABASE_URL: postgresql+psycopg://titan@db/titan
      TITAN_DATABASE_PASSWORD_FILE: /run/secrets/db_password
    secrets: [db_password]
    networks: [titan]
    depends_on:
      db:
        condition: service_healthy

  # The controller (decisions #4, #142): drives the stack with `docker
  # compose` through the Docker socket, the most sensitive privilege on the
  # node, since it amounts to root on the machine. So it has no network at
  # all and serves only a Unix socket in its own volume (decision #78), which
  # only the api shares: the socket is mode 0660 in a 0750 folder, owned by
  # the controller's user 10002 and the api's group 10001.
  controller:
    image: ${TITAN_CONTROLLER_IMAGE:?}
    user: "10002:10001"
    # The group that owns the Docker socket on the machine, so the
    # controller reaches Docker without being root.
    group_add: ["${DOCKER_GID:?}"]
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    mem_limit: 64m
    network_mode: none
    environment:
      TITAN_NODE_DIR: ${TITAN_NODE_DIR:?}
      TITAN_COMPOSE_PROJECT: ${TITAN_COMPOSE_PROJECT:-titan}
      TITAN_CONTROLLER_SOCKET: /run/titan-controller/controller.sock
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # The node folder at the same path as on the machine (decision #148),
      # so paths in compose.yaml mean the same inside and out.
      - ${TITAN_NODE_DIR:?}:${TITAN_NODE_DIR:?}:ro
      # The secret store, the one folder the controller writes to
      # (decision #163).
      - ${TITAN_NODE_DIR:?}/secrets:${TITAN_NODE_DIR:?}/secrets
      - controller-socket:/run/titan-controller
    restart: unless-stopped

  db:
    image: pgvector/pgvector:0.8.6-pg18-trixie@sha256:78bf48b801e792f99e3ac62b5036fd3876e9be48afda16c1e331af1c75ceb2ff
    read_only: true
    tmpfs: [/var/run/postgresql, /tmp]
    mem_limit: 1g
    environment:
      POSTGRES_USER: titan
      POSTGRES_DB: titan
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets: [db_password]
    volumes: [db-data:/var/lib/postgresql]
    networks: [titan]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "titan", "-d", "titan"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

# The secret files and tls/key.pem are mode 0644 in 0700 folders: compose
# mounts a file with its owner and mode, and the containers read them as
# different users (decision #77). `secrets init` creates the missing ones
# before the stack first starts (decision #163).
secrets:
  db_password:
    file: ./secrets/db_password
  token_key:
    file: ./secrets/token_key

volumes:
  db-data:
  controller-socket:

# NOTE: the subnet is fixed, so nginx's address is known to the api; Docker
# refuses to start the stack if the subnet overlaps a network already on the
# machine. It lies inside Docker's default address pool (172.17.0.0/16 to
# 172.31.0.0/16), so a network Docker created for something else may hold
# it. The controller will pick a free subnet at install.
networks:
  titan:
    ipam:
      config:
        - subnet: 172.31.250.0/24
          gateway: 172.31.250.1
          # Containers without a fixed address get one from the upper half,
          # so none can take nginx's before nginx starts.
          ip_range: 172.31.250.128/25
